<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Temple Product Video Generator V1.1.1</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" aria-label="主要導覽">
        <div class="brand">
          <span class="brand-mark">T</span>
          <div>
            <strong>Temple AI Studio</strong>
            <span>Product Video Generator V1.1.1</span>
          </div>
        </div>
        <nav class="nav">
          <button class="nav-item" data-route="home">首頁</button>
          <button class="nav-item" data-route="library">商品資料庫</button>
          <button class="nav-item" data-route="create">建立影片</button>
          <button class="nav-item" data-route="progress">生成進度</button>
          <button class="nav-item" data-route="preview">影片預覽</button>
          <button class="nav-item" data-route="scene">場景細節</button>
          <button class="nav-item" data-route="export">輸出</button>
          <button class="nav-item" data-route="settings">設定</button>
        </nav>
        <div class="sidebar-note">
          <strong>V1 Local</strong>
          <span>本機執行，不會自動呼叫付費 API。使用商品照片、中文內容與 FFmpeg 輸出 MP4。</span>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">V1.1.1 Production</p>
            <h1 id="screen-title">Temple Product Video Generator</h1>
          </div>
          <div class="status-strip" id="status-strip"></div>
        </header>

        <main id="app" class="content" tabindex="-1"></main>
      </div>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
